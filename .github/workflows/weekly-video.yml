name: Weekly video

on:
  schedule:
    - cron: "17 4 * * 2,5"   # Tuesday and Friday, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  make-video:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: youtube-automation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core
      - run: pip install -r requirements.txt
      - name: Write YouTube credentials
        run: |
          echo '${{ secrets.YT_CLIENT_SECRET }}' > client_secret.json
          echo '${{ secrets.YT_TOKEN }}' > token.json
      - name: Run autopilot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HINDI_FONT: /usr/share/fonts/truetype/noto/NotoSansDevanagari-Bold.ttf
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'private' }}
          NICHE: ${{ vars.NICHE || 'everyday money, rules, rights and how things work in India' }}
        run: python pipeline.py autopilot
      - name: Save topic history
        run: |
          git config user.name "video-bot" && git config user.email "video-bot@users.noreply.github.com"
          git add done.json && git diff --cached --quiet || (git commit -m "Update topic history" && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: output
          path: youtube-automation/output
          retention-days: 7
